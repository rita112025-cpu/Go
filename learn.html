<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>弈境 · 教學區</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6f1e7;
      --ink: #1c1917;
      --ink-soft: rgba(28, 25, 23, 0.62);
      --line: rgba(0, 0, 0, 0.1);
      --card: rgba(255, 255, 255, 0.72);
      --accent: #b45309;
      --good: #15803d;
      --bad: #b91c1c;
      --hint: rgba(250, 204, 21, 0.38);
    }
    * { box-sizing: border-box; font-family: 'Noto Serif TC', ui-serif, serif; }
    html, body { margin: 0; }
    body {
      background-color: var(--paper);
      background-image:
        radial-gradient(at 20% 30%, rgba(0,0,0,0.03) 0 1px, transparent 1px),
        radial-gradient(at 80% 70%, rgba(0,0,0,0.02) 0 1px, transparent 1px);
      color: var(--ink);
      min-height: 100vh;
    }
    button { cursor: pointer; font-size: 14px; }
    a { color: inherit; }

    header {
      position: sticky; top: 0; z-index: 30;
      backdrop-filter: blur(16px);
      background: rgba(246, 241, 231, 0.9);
      border-bottom: 1px solid var(--line);
    }
    .bar { max-width: 1280px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .seal { width: 36px; height: 36px; border-radius: 50%; background: #000; color: var(--paper); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
    .brand h1 { margin: 0; font-size: 22px; letter-spacing: 0.2em; }
    .brand p { margin: -2px 0 0; font-size: 11px; letter-spacing: 0.3em; opacity: 0.6; }
    nav.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); text-decoration: none; font-size: 14px;
    }
    .pill:hover { background: #fafaf9; }
    .pill.dark, .pill[aria-selected="true"] { background: #000; color: var(--paper); border-color: #000; }
    .pill:disabled { opacity: 0.4; cursor: default; }

    main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
    .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
    .muted { color: var(--ink-soft); }

    .lesson-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .lesson-list button {
      width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px;
      display: flex; justify-content: space-between; gap: 8px; color: var(--ink);
    }
    .lesson-list button:hover { background: rgba(0,0,0,0.04); }
    .lesson-list button[aria-current="true"] { background: #000; color: var(--paper); }
    .lesson-list .count { font-size: 12px; opacity: 0.7; white-space: nowrap; }

    .intro h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0.08em; }
    .intro p { margin: 6px 0; line-height: 1.85; }
    .essence { margin-top: 10px; padding: 10px 14px; border-left: 3px solid var(--accent); background: rgba(180, 83, 9, 0.06); border-radius: 0 10px 10px 0; line-height: 1.8; }

    .play { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
    .board-wrap { width: 100%; max-width: 520px; }
    .board-wrap svg { width: 100%; height: auto; display: block; border-radius: 14px; touch-action: manipulation; user-select: none; }
    .side { display: flex; flex-direction: column; gap: 12px; }
    .side h3 { margin: 0; font-size: 18px; }
    .prompt { line-height: 1.8; margin: 4px 0 0; }
    .dots { display: flex; gap: 6px; flex-wrap: wrap; }
    .dot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 12px; padding: 0; }
    .dot[aria-current="true"] { border-color: #000; border-width: 2px; }
    .dot.solved { background: #000; color: var(--paper); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .feedback { line-height: 1.8; padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,0.04); min-height: 52px; }
    .feedback.good { background: rgba(21, 128, 61, 0.1); color: #14532d; }
    .feedback.bad { background: rgba(185, 28, 28, 0.08); color: #7f1d1d; }
    .feedback.hint { background: rgba(250, 204, 21, 0.2); color: #713f12; }
    .stars { letter-spacing: 0.2em; color: var(--accent); }

    .log { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .log li { font-size: 14px; line-height: 1.7; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,0.035); }
    .log li.warn { background: rgba(185, 28, 28, 0.08); }
    .log li.good { background: rgba(21, 128, 61, 0.1); }
    .log li.ai { background: rgba(255,255,255,0.8); border: 1px solid var(--line); }
    .stat { display: flex; justify-content: space-between; font-size: 14px; }
    label.toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; }
    select { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: #fff; font-size: 14px; }

    .proverbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .proverbs .card h3 { margin: 0 0 4px; font-size: 20px; letter-spacing: 0.12em; }
    .proverbs .card p { margin: 6px 0 0; line-height: 1.8; font-size: 15px; }
    .tag { display: inline-block; font-size: 11px; letter-spacing: 0.2em; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,0.06); }
    .section-title { margin: 28px 0 12px; font-size: 18px; letter-spacing: 0.15em; }

    [hidden] { display: none !important; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .lesson-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
      .lesson-list button { white-space: nowrap; }
      .play { grid-template-columns: minmax(0, 1fr); }
      .board-wrap { margin: 0 auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">
        <div class="seal">弈</div>
        <div>
          <h1>弈境 · 教學區</h1>
          <p>由淺入深 · 學圍棋的精髓</p>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <button class="pill" role="tab" data-view="lessons" aria-selected="true">課程與題目</button>
        <button class="pill" role="tab" data-view="practice" aria-selected="false">9 路實戰（提示下一步）</button>
        <button class="pill" role="tab" data-view="proverbs" aria-selected="false">棋理與格言</button>
        <a class="pill" href="index.html">← 回到對弈</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="view-lessons" class="layout">
      <aside class="card" style="padding: 10px;">
        <ul class="lesson-list" id="lesson-list"></ul>
      </aside>
      <div>
        <article class="card intro" id="lesson-intro"></article>
        <div class="play">
          <div class="board-wrap" id="problem-board"></div>
          <div class="side">
            <div class="card">
              <div class="dots" id="problem-dots"></div>
              <h3 id="problem-title" style="margin-top: 12px;"></h3>
              <p class="prompt" id="problem-prompt"></p>
            </div>
            <div class="feedback" id="problem-feedback" aria-live="polite"></div>
            <div class="actions">
              <button class="pill" id="btn-hint">💡 提示</button>
              <button class="pill" id="btn-reset">↺ 重來</button>
              <button class="pill dark" id="btn-next">下一題 →</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="view-practice" hidden>
      <div class="play" style="margin-top: 0;">
        <div class="board-wrap" id="practice-board"></div>
        <div class="side">
          <div class="card">
            <h3>9 路實戰：邊下邊學</h3>
            <p class="prompt muted">你執黑先行，對手是白棋 AI。卡住時按「提示」，會先告訴你<strong>該想什麼</strong>，再按一次才顯示落點；每一手都有講評，幫你養成好習慣。</p>
            <div class="stat" style="margin-top: 8px;"><span>手數</span><span id="pr-move">0</span></div>
            <div class="stat"><span>黑提子 / 白提子</span><span id="pr-caps">0 / 0</span></div>
            <div class="stat"><span>貼目</span><span>6.5</span></div>
          </div>
          <div class="feedback" id="practice-feedback" aria-live="polite">黑先。開局先想想：哪裡是最有價值的地方？</div>
          <div class="actions">
            <button class="pill" id="pr-hint">💡 提示下一步</button>
            <button class="pill" id="pr-undo">悔棋</button>
            <button class="pill" id="pr-pass">虛著</button>
            <button class="pill" id="pr-territory">形勢判斷</button>
            <button class="pill dark" id="pr-new">新局</button>
          </div>
          <div class="actions" style="align-items: center;">
            <label class="toggle"><input type="checkbox" id="pr-review" checked> 每手講評</label>
            <label class="toggle">對手
              <select id="pr-level">
                <option value="easy">入門</option>
                <option value="normal" selected>普通</option>
              </select>
            </label>
          </div>
          <ul class="log" id="practice-log"></ul>
        </div>
      </div>
    </section>

    <section id="view-proverbs" hidden>
      <h2 class="section-title">圍棋十訣 <span class="tag">唐 · 王積薪</span></h2>
      <div class="proverbs" id="ten-rules"></div>
      <h2 class="section-title">常用棋諺</h2>
      <div class="proverbs" id="sayings"></div>
    </section>
  </main>

  <script id="go-engine">
  (function (root) {
    'use strict';
    const EMPTY = 0, BLACK = 1, WHITE = 2;
    const COLS = 'ABCDEFGHJKLMNOPQRST';
    const other = (c) => (c === BLACK ? WHITE : BLACK);
    const key = (x, y) => x + ',' + y;

    function createBoard(size) {
      return Array.from({ length: size }, () => Array(size).fill(EMPTY));
    }
    function cloneBoard(b) {
      return b.map((r) => r.slice());
    }
    function neighbors(size, x, y) {
      const out = [];
      if (x > 0) out.push([x - 1, y]);
      if (x < size - 1) out.push([x + 1, y]);
      if (y > 0) out.push([x, y - 1]);
      if (y < size - 1) out.push([x, y + 1]);
      return out;
    }
    function getGroup(board, x, y) {
      const color = board[y][x];
      if (color === EMPTY) return null;
      const size = board.length;
      const seen = new Set([key(x, y)]);
      const libSet = new Set();
      const stones = [];
      const stack = [[x, y]];
      while (stack.length) {
        const [cx, cy] = stack.pop();
        stones.push([cx, cy]);
        for (const [nx, ny] of neighbors(size, cx, cy)) {
          const v = board[ny][nx];
          if (v === EMPTY) libSet.add(key(nx, ny));
          else if (v === color && !seen.has(key(nx, ny))) {
            seen.add(key(nx, ny));
            stack.push([nx, ny]);
          }
        }
      }
      const libs = Array.from(libSet, (k) => k.split(',').map(Number));
      return { color, stones, libs };
    }
    function play(board, x, y, color, ko) {
      if (board[y][x] !== EMPTY) return { legal: false, reason: '此處已有棋子' };
      if (ko && ko[0] === x && ko[1] === y) return { legal: false, reason: '劫爭：不能立即提回，要先在別處找劫材' };
      const size = board.length;
      const next = cloneBoard(board);
      next[y][x] = color;
      const captured = [];
      for (const [nx, ny] of neighbors(size, x, y)) {
        if (next[ny][nx] !== other(color)) continue;
        const g = getGroup(next, nx, ny);
        if (g.libs.length === 0) {
          for (const [sx, sy] of g.stones) {
            next[sy][sx] = EMPTY;
            captured.push([sx, sy]);
          }
        }
      }
      const self = getGroup(next, x, y);
      if (self.libs.length === 0) return { legal: false, reason: '禁著點：下在這裡自己沒有氣' };
      const newKo = captured.length === 1 && self.stones.length === 1 && self.libs.length === 1 ? captured[0] : null;
      return { legal: true, board: next, captured, ko: newKo };
    }
    function parseDiagram(rows) {
      return rows.map((row) => Array.from(row, (ch) => (ch === 'X' ? BLACK : ch === 'O' ? WHITE : EMPTY)));
    }
    function toCoord(x, y, size) {
      return COLS[x] + (size - y);
    }
    function fromCoord(str, size) {
      return [COLS.indexOf(str[0].toUpperCase()), size - parseInt(str.slice(1), 10)];
    }

    // Tactical reader for ladders, nets and snapbacks: can the attacker capture the
    // group at (tx, ty)? Only follows forcing lines (target with at most 2 liberties).
    function canCapture(board, tx, ty, attackerToMove, depth, ko, budget) {
      budget = budget || { nodes: 20000 };
      if (--budget.nodes < 0) return false;
      if (board[ty][tx] === EMPTY) return true;
      const g = getGroup(board, tx, ty);
      const attacker = other(g.color);
      const size = board.length;
      if (attackerToMove) {
        if (g.libs.length === 1) {
          const [lx, ly] = g.libs[0];
          if (play(board, lx, ly, attacker, ko).legal) return true;
        }
        if (g.libs.length >= 3 || depth <= 0) return false;
        const cand = new Map();
        for (const [lx, ly] of g.libs) cand.set(key(lx, ly), [lx, ly]);
        for (const [lx, ly] of g.libs) {
          for (const [nx, ny] of neighbors(size, lx, ly)) {
            if (board[ny][nx] === EMPTY && !cand.has(key(nx, ny))) cand.set(key(nx, ny), [nx, ny]);
          }
        }
        for (const [cx, cy] of cand.values()) {
          const r = play(board, cx, cy, attacker, ko);
          if (!r.legal) continue;
          if (canCapture(r.board, tx, ty, false, depth - 1, r.ko, budget)) return true;
        }
        return false;
      }
      if (g.libs.length >= 3 || depth <= 0) return false;
      let any = false;
      for (const [cx, cy] of defenderMoves(board, g)) {
        const r = play(board, cx, cy, g.color, ko);
        if (!r.legal) continue;
        any = true;
        if (!canCapture(r.board, tx, ty, true, depth - 1, r.ko, budget)) return false;
      }
      if (!any) return canCapture(board, tx, ty, true, depth - 1, null, budget);
      return true;
    }
    function defenderMoves(board, g) {
      const size = board.length;
      const cand = new Map();
      for (const [lx, ly] of g.libs) cand.set(key(lx, ly), [lx, ly]);
      const seen = new Set();
      for (const [sx, sy] of g.stones) {
        for (const [nx, ny] of neighbors(size, sx, sy)) {
          if (board[ny][nx] !== other(g.color) || seen.has(key(nx, ny))) continue;
          const eg = getGroup(board, nx, ny);
          eg.stones.forEach(([ex, ey]) => seen.add(key(ex, ey)));
          if (eg.libs.length === 1) cand.set(key(eg.libs[0][0], eg.libs[0][1]), eg.libs[0]);
        }
      }
      return Array.from(cand.values());
    }
    // Best defender reply: one that escapes if possible, else the one keeping most liberties.
    function bestDefense(board, tx, ty, ko, depth) {
      const g = getGroup(board, tx, ty);
      let best = null;
      for (const [cx, cy] of defenderMoves(board, g)) {
        const r = play(board, cx, cy, g.color, ko);
        if (!r.legal) continue;
        const escapes = !canCapture(r.board, tx, ty, true, depth, r.ko);
        const libs = getGroup(r.board, tx, ty).libs.length;
        const value = (escapes ? 1000 : 0) + libs * 10 + r.captured.length;
        if (!best || value > best.value) best = { x: cx, y: cy, result: r, escapes, value };
      }
      return best;
    }

    function territory(board) {
      const size = board.length;
      const owner = createBoard(size);
      const seen = createBoard(size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (board[y][x] !== EMPTY || seen[y][x]) continue;
          const region = [];
          const borders = new Set();
          const stack = [[x, y]];
          seen[y][x] = 1;
          while (stack.length) {
            const [cx, cy] = stack.pop();
            region.push([cx, cy]);
            for (const [nx, ny] of neighbors(size, cx, cy)) {
              const v = board[ny][nx];
              if (v === EMPTY && !seen[ny][nx]) {
                seen[ny][nx] = 1;
                stack.push([nx, ny]);
              } else if (v !== EMPTY) borders.add(v);
            }
          }
          if (borders.size === 1) {
            const c = borders.values().next().value;
            for (const [rx, ry] of region) owner[ry][rx] = c;
          }
        }
      }
      return owner;
    }
    // Rough ownership estimate from stone influence; used for the "形勢判斷" overlay.
    function influence(board) {
      const size = board.length;
      const owner = createBoard(size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (board[y][x] !== EMPTY) continue;
          let s = 0;
          for (let sy = 0; sy < size; sy++) {
            for (let sx = 0; sx < size; sx++) {
              const v = board[sy][sx];
              if (v === EMPTY) continue;
              const d = Math.abs(sx - x) + Math.abs(sy - y);
              if (d <= 3) s += (v === BLACK ? 1 : -1) * (4 - d);
            }
          }
          if (s >= 2) owner[y][x] = BLACK;
          else if (s <= -2) owner[y][x] = WHITE;
        }
      }
      return owner;
    }
    function countOwner(board, owner) {
      let b = 0, w = 0;
      for (let y = 0; y < board.length; y++) {
        for (let x = 0; x < board.length; x++) {
          if (board[y][x] !== EMPTY) continue;
          if (owner[y][x] === BLACK) b++;
          else if (owner[y][x] === WHITE) w++;
        }
      }
      return { b, w };
    }

    root.GoEngine = {
      EMPTY, BLACK, WHITE, other, createBoard, cloneBoard, neighbors, getGroup, play,
      parseDiagram, toCoord, fromCoord, canCapture, bestDefense, territory, influence, countOwner,
    };
  })(typeof window !== 'undefined' ? window : globalThis);
  </script>

  <script id="go-coach">
  (function (root) {
    'use strict';
    const G = root.GoEngine;
    const { EMPTY, other } = G;

    const PRINCIPLES = {
      capture: '提子是最實在的收穫。先看有沒有能吃的棋，是每一手的第一個檢查。',
      save: '自己的棋被叫吃了，如果還逃得出去，就要先救——「攻彼顧我」。',
      kill: '要吃就吃乾淨：叫吃之後對方逃不掉（征子），這一手非常有力。',
      net: '不必急著叫吃。封住對方的去路（枷），讓它無路可逃。',
      connect: '連則強，斷則弱。把危險的棋連成一塊，厚實就是力量。',
      cut: '「棋從斷處生」——切斷對方，讓它兩邊都要照顧。',
      corner: '「金角銀邊草肚皮」：角上用最少的子就能圍到地，先佔空角。',
      extend: '向寬廣處展開，與自己的子保持適當距離（立二拆三），效率最高。',
      approach: '靠近對方的子施壓，同時與自己的子呼應，攻守兼備。',
      selfatari: '下完自己只剩一口氣（自緊氣），對方一手就能提掉。',
      futile: '這塊棋已經逃不掉了，越逃損失越大——「逢危須棄」。',
      weak: '這手之後自己的棋會被征吃或枷吃，形狀很薄。',
      eye: '這是自己的眼位，填掉等於自毀根基。',
      edge: '一路（邊線）的子效率很低，除非是官子或死活要點，否則別急著下。',
      slow: '貼著自己的子下，棋形重複、效率偏低（俗稱「愚形」）。',
    };

    function lineOf(size, x, y) {
      return Math.min(x, y, size - 1 - x, size - 1 - y);
    }
    function nearestStone(board, x, y, color) {
      let best = Infinity;
      for (let sy = 0; sy < board.length; sy++) {
        for (let sx = 0; sx < board.length; sx++) {
          if (board[sy][sx] !== color) continue;
          best = Math.min(best, Math.abs(sx - x) + Math.abs(sy - y));
        }
      }
      return best;
    }
    function adjacentGroups(board, x, y, color) {
      const groups = [];
      const seen = new Set();
      for (const [nx, ny] of G.neighbors(board.length, x, y)) {
        if (board[ny][nx] !== color || seen.has(nx + ',' + ny)) continue;
        const g = G.getGroup(board, nx, ny);
        g.stones.forEach(([sx, sy]) => seen.add(sx + ',' + sy));
        groups.push(g);
      }
      return groups;
    }
    function quadrantEmpty(board, x, y) {
      const size = board.length;
      const mid = Math.floor(size / 2);
      const xs = x < mid ? [0, mid - 1] : [mid + 1, size - 1];
      const ys = y < mid ? [0, mid - 1] : [mid + 1, size - 1];
      for (let yy = ys[0]; yy <= ys[1]; yy++) {
        for (let xx = xs[0]; xx <= xs[1]; xx++) if (board[yy][xx] !== EMPTY) return false;
      }
      return true;
    }

    // Scores every legal move for `color` and explains why, so the same analysis
    // drives the AI, the hint button and the per-move review.
    function analyzeMoves(board, color, ko, moveNum) {
      const size = board.length;
      const opp = other(color);
      const mid = Math.floor(size / 2);
      const out = [];
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (board[y][x] !== EMPTY) continue;
          const r = G.play(board, x, y, color, ko);
          if (!r.legal) continue;
          const reasons = [];
          const add = (tag, text, w) => reasons.push({ tag, text, w });
          const coord = G.toCoord(x, y, size);

          const neigh = G.neighbors(size, x, y);
          if (neigh.every(([nx, ny]) => board[ny][nx] === color) && !r.captured.length) {
            add('eye', `${coord} 是自己的眼`, -70);
          }
          if (r.captured.length) add('capture', `${coord} 提掉 ${r.captured.length} 子`, 60 + 25 * r.captured.length);

          for (const g of adjacentGroups(board, x, y, color)) {
            if (g.libs.length !== 1) continue;
            const after = G.getGroup(r.board, x, y);
            const safe = after.libs.length >= 3 ||
              (after.libs.length === 2 && !G.canCapture(r.board, x, y, true, 12, r.ko, { nodes: 3000 }));
            if (safe) add('save', `${coord} 救出被叫吃的 ${g.stones.length} 子`, 50 + 20 * g.stones.length);
            else if (!r.captured.length) add('futile', `${coord} 想逃但仍會被吃`, -25 - 5 * g.stones.length);
          }

          const mine = G.getGroup(r.board, x, y);
          if (mine.libs.length === 1 && !r.captured.length) {
            add('selfatari', `${coord} 自緊氣，只剩一口氣`, -70 - 10 * mine.stones.length);
          } else if (mine.libs.length === 2 && G.canCapture(r.board, x, y, true, 10, r.ko, { nodes: 2000 })) {
            add('weak', `${coord} 之後會被征吃或枷吃`, -35);
          }

          for (const g of adjacentGroups(r.board, x, y, opp)) {
            const [gx, gy] = g.stones[0];
            if (g.libs.length === 1) {
              const dead = G.canCapture(r.board, gx, gy, false, 12, r.ko, { nodes: 3000 });
              if (dead) add('kill', `${coord} 叫吃 ${g.stones.length} 子，對方逃不掉`, 40 + 15 * g.stones.length);
              else add('atari', `${coord} 叫吃`, 6);
            } else if (g.libs.length === 2 && G.canCapture(r.board, gx, gy, false, 12, r.ko, { nodes: 3000 })) {
              add('net', `${coord} 封鎖 ${g.stones.length} 子的退路`, 30 + 12 * g.stones.length);
            }
          }

          const ownAdj = adjacentGroups(board, x, y, color);
          if (ownAdj.length >= 2) {
            const weak = ownAdj.some((g) => g.libs.length <= 2);
            add('connect', `${coord} 把棋連起來`, weak ? 22 : 8);
          }
          if (adjacentGroups(board, x, y, opp).length >= 2) add('cut', `${coord} 切斷對方`, 14);

          const line = lineOf(size, x, y);
          const myDist = nearestStone(board, x, y, color);
          const oppDist = nearestStone(board, x, y, opp);
          const anyDist = Math.min(myDist, oppDist);
          if (moveNum < 10 && line === 2 && x !== mid && y !== mid && quadrantEmpty(board, x, y)) {
            add('corner', `${coord} 佔空角`, 32);
          }
          if (line === 0) add('edge', `${coord} 在一路`, moveNum < 30 ? -14 : -4);
          else if (line === 1 && moveNum < 16) add('edge', `${coord} 在二路`, -4);
          if (anyDist >= 3 && myDist <= 4 && myDist !== Infinity && line >= 1) add('extend', `${coord} 拆邊展開`, 12);
          if (oppDist === 2 && myDist <= 3 && line >= 1) add('approach', `${coord} 靠近施壓`, 6);
          if (myDist === 1 && oppDist > 2 && !r.captured.length && !reasons.some((q) => q.tag === 'save' || q.tag === 'connect')) {
            add('slow', `${coord} 緊貼己子`, -6);
          }
          if (line >= 2 && line <= 3) add('line', '', 2);

          const score = reasons.reduce((s, q) => s + q.w, 0);
          const sorted = reasons.filter((q) => q.text).sort((a, b) => Math.abs(b.w) - Math.abs(a.w));
          const main = score >= 0
            ? sorted.find((q) => q.w > 0) || null
            : sorted.find((q) => q.w < 0) || null;
          out.push({ x, y, score, reasons, main });
        }
      }
      return out.sort((a, b) => b.score - a.score);
    }

    root.GoCoach = { analyzeMoves, PRINCIPLES };
  })(window);
  </script>

        <radialGradient id="${id}-gB" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#5a5a5a"/><stop offset=".4" stop-color="#1a1a1a"/><stop offset="1" stop-color="#000"/></radialGradient>
        <radialGradient id="${id}-gW" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#f1f1f1"/><stop offset="1" stop-color="#cfcfcf"/></radialGradient>
        <filter id="${id}-sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-opacity=".4"/></filter>
      </defs>`;
      s += `<rect width="${VIEW}" height="${VIEW}" rx="14" fill="url(#${id}-wood)"/>`;
      for (let i = 0; i < SIZE; i++) {
        s += `<line x1="${px(0)}" y1="${px(i)}" x2="${px(SIZE - 1)}" y2="${px(i)}" stroke="#3b2a14" stroke-width="${i === 0 || i === SIZE - 1 ? 1.6 : 0.9}"/>`;
        s += `<line x1="${px(i)}" y1="${px(0)}" x2="${px(i)}" y2="${px(SIZE - 1)}" stroke="#3b2a14" stroke-width="${i === 0 || i === SIZE - 1 ? 1.6 : 0.9}"/>`;
        const col = 'ABCDEFGHJ'[i];
        s += `<text x="${px(i)}" y="${MARGIN - 16}" font-size="11" text-anchor="middle" fill="#5b4320">${col}</text>`;
        s += `<text x="${px(i)}" y="${VIEW - MARGIN + 24}" font-size="11" text-anchor="middle" fill="#5b4320">${col}</text>`;
        s += `<text x="${MARGIN - 18}" y="${px(i) + 4}" font-size="11" text-anchor="middle" fill="#5b4320">${SIZE - i}</text>`;
        s += `<text x="${VIEW - MARGIN + 18}" y="${px(i) + 4}" font-size="11" text-anchor="middle" fill="#5b4320">${SIZE - i}</text>`;
      }
      for (const [x, y] of STAR) s += `<circle cx="${px(x)}" cy="${px(y)}" r="3" fill="#3b2a14"/>`;
      if (area) {
        for (const [x, y] of area) s += `<rect x="${px(x) - CELL / 2}" y="${px(y) - CELL / 2}" width="${CELL}" height="${CELL}" fill="var(--hint)"/>`;
      }
      if (owner) {
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            if (board[y][x] !== EMPTY || !owner[y][x]) continue;
            s += `<rect x="${px(x) - 7}" y="${px(y) - 7}" width="14" height="14" rx="2" fill="${owner[y][x] === BLACK ? '#111' : '#fafafa'}" opacity=".7" stroke="#0004" stroke-width=".5"/>`;
          }
        }
      }
      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          const v = board[y][x];
          if (v === EMPTY) continue;
          s += `<circle cx="${px(x)}" cy="${px(y)}" r="18" fill="url(#${id}-${v === BLACK ? 'gB' : 'gW'})" filter="url(#${id}-sh)"/>`;
        }
      }
      if (last) {
        const c = board[last[1]][last[0]] === BLACK ? '#fff' : '#111';
        s += `<circle cx="${px(last[0])}" cy="${px(last[1])}" r="6" fill="none" stroke="${c}" stroke-width="2"/>`;
      }
      if (answer) {
        s += `<circle cx="${px(answer[0])}" cy="${px(answer[1])}" r="15" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="5 4">
          <animate attributeName="r" values="13;17;13" dur="1.4s" repeatCount="indefinite"/></circle>`;
      }
      if (ghost) s += `<circle class="ghost" cx="0" cy="0" r="18" fill="url(#${id}-${ghost === BLACK ? 'gB' : 'gW'})" opacity="0" pointer-events="none"/>`;
      s += '</svg>';
      container.innerHTML = s;
    }

    function pointFromEvent(svg, ev) {
      const rect = svg.getBoundingClientRect();
      const vx = ((ev.clientX - rect.left) / rect.width) * VIEW;
      const vy = ((ev.clientY - rect.top) / rect.height) * VIEW;
      const x = Math.round((vx - MARGIN) / CELL);
      const y = Math.round((vy - MARGIN) / CELL);
      if (x < 0 || y < 0 || x >= SIZE || y >= SIZE) return null;
      return [x, y];
    }
    function bindBoard(container, getBoard, onPlay) {
      container.addEventListener('click', (ev) => {
        const svg = container.querySelector('svg');
        const p = svg && pointFromEvent(svg, ev);
        if (p) onPlay(p[0], p[1]);
      });
      container.addEventListener('pointermove', (ev) => {
        const svg = container.querySelector('svg');
        const ghost = svg && svg.querySelector('.ghost');
        if (!ghost) return;
        const p = pointFromEvent(svg, ev);
        const board = getBoard();
        if (p && board[p[1]][p[0]] === EMPTY) {
          ghost.setAttribute('cx', px(p[0]));
          ghost.setAttribute('cy', px(p[1]));
          ghost.setAttribute('opacity', '0.45');
        } else ghost.setAttribute('opacity', '0');
      });
      container.addEventListener('pointerleave', () => {
        const ghost = container.querySelector('.ghost');
        if (ghost) ghost.setAttribute('opacity', '0');
      });
    }
    function areaAround(x, y) {
      const out = [];
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && ny >= 0 && nx < SIZE && ny < SIZE) out.push([nx, ny]);
        }
      }
      return out;
    }
    const coord = (x, y) => G.toCoord(x, y, SIZE);
    const $ = (id) => document.getElementById(id);

    // ---------- Tabs ----------
    document.querySelectorAll('[role="tab"]').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('[role="tab"]').forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
        ['lessons', 'practice', 'proverbs'].forEach((v) => { $('view-' + v).hidden = v !== tab.dataset.view; });
        if (tab.dataset.view === 'practice') drawPractice();
      });
    });

    // ---------- Lessons view ----------
    const ps = { lesson: 0, index: 0, board: null, ko: null, last: null, status: 'playing', hintLevel: 0 };
    const currentProblem = () => LESSONS[ps.lesson].problems[ps.index];
    const problemId = (l, i) => LESSONS[l].id + '-' + i;

    function renderLessonList() {
      $('lesson-list').innerHTML = LESSONS.map((l, i) => {
        const solved = l.problems.filter((_, j) => progress[problemId(i, j)]).length;
        return `<li><button data-lesson="${i}" aria-current="${i === ps.lesson}"><span>${l.title}</span><span class="count">${solved}/${l.problems.length}</span></button></li>`;
      }).join('');
      $('lesson-list').querySelectorAll('button').forEach((b) => {
        b.addEventListener('click', () => openLesson(Number(b.dataset.lesson), 0));
      });
    }
    function openLesson(l, i) {
      ps.lesson = l;
      const lesson = LESSONS[l];
      $('lesson-intro').innerHTML = `<h2>${lesson.title}</h2>${lesson.intro.map((p) => `<p>${p}</p>`).join('')}<div class="essence">${lesson.essence}</div>`;
      openProblem(i);
    }
    function openProblem(i) {
      ps.index = i;
      const p = currentProblem();
      ps.board = G.parseDiagram(p.diagram);
      ps.ko = null;
      ps.last = null;
      ps.status = 'playing';
      ps.hintLevel = 0;
      $('problem-title').textContent = p.title;
      $('problem-prompt').textContent = p.prompt;
      setFeedback('problem-feedback', '', '黑先。點擊棋盤落子。');
      renderLessonList();
      drawProblem();
    }
    function drawProblem() {
      const p = currentProblem();
      const ans = G.fromCoord(p.answers[0], SIZE);
      renderBoard($('problem-board'), {
        board: ps.board,
        last: ps.last,
        area: ps.hintLevel >= 1 && ps.status !== 'solved' ? areaAround(ans[0], ans[1]) : null,
        answer: ps.hintLevel >= 2 && ps.status !== 'solved' ? ans : null,
        ghost: ps.status === 'playing' ? BLACK : null,
      });
      const lesson = LESSONS[ps.lesson];
      $('problem-dots').innerHTML = lesson.problems.map((_, j) => {
        const done = progress[problemId(ps.lesson, j)];
        return `<button class="dot ${done ? 'solved' : ''}" data-i="${j}" aria-current="${j === ps.index}" title="第 ${j + 1} 題">${j + 1}</button>`;
      }).join('');
      $('problem-dots').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => openProblem(Number(b.dataset.i))));
      const hints = p.hints.length;
      $('btn-hint').textContent = ps.hintLevel >= hints ? '💡 提示（已全部顯示）' : `💡 提示 ${ps.hintLevel + 1}/${hints}`;
      $('btn-hint').disabled = ps.status === 'solved';
      const last = ps.lesson === LESSONS.length - 1 && ps.index === lesson.problems.length - 1;
      $('btn-next').disabled = last;
    }
    function setFeedback(id, kind, html) {
      const el = $(id);
      el.className = 'feedback' + (kind ? ' ' + kind : '');
      el.innerHTML = html;
    }
    function solve() {
      const p = currentProblem();
      ps.status = 'solved';
      const stars = Math.max(1, 3 - ps.hintLevel);
      const id = problemId(ps.lesson, ps.index);
      progress[id] = Math.max(progress[id] || 0, stars);
      saveProgress(progress);
      setFeedback('problem-feedback', 'good', `<strong>正確！</strong> <span class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</span><br>${p.explain}`);
    }
    function fail(msg) {
      ps.status = 'failed';
      setFeedback('problem-feedback', 'bad', `${msg}<br>按「重來」再試一次，或用「提示」找方向。`);
    }
    function onProblemClick(x, y) {
      if (ps.status !== 'playing') return;
      const p = currentProblem();
      const r = G.play(ps.board, x, y, BLACK, ps.ko);
      if (!r.legal) {
        setFeedback('problem-feedback', 'bad', r.reason);
        return;
      }
      ps.board = r.board;
      ps.ko = r.ko;
      ps.last = [x, y];
      const here = coord(x, y);

      if (p.type === 'point') {
        if (p.answers.includes(here)) solve();
        else fail((p.wrong && p.wrong[here]) || `${here} 不是最好的一手。`);
      } else if (p.type === 'escape') {
        const [tx, ty] = G.fromCoord(p.target, SIZE);
        if (ps.board[ty][tx] === BLACK && !G.canCapture(ps.board, tx, ty, true, 16, ps.ko)) solve();
        else fail(`${here} 之後，黑棋還是會被吃掉。`);
      } else if (p.type === 'capture') {
        const [tx, ty] = G.fromCoord(p.target, SIZE);
        if (ps.board[ty][tx] === EMPTY) {
          solve();
        } else {
          const d = G.bestDefense(ps.board, tx, ty, ps.ko, 16);
          if (!d) {
            setFeedback('problem-feedback', '', '白棋無路可走，繼續。');
          } else {
            ps.status = 'waiting';
            setTimeout(() => {
              ps.board = d.result.board;
              ps.ko = d.result.ko;
              ps.last = [d.x, d.y];
              const reply = coord(d.x, d.y);
              if (d.escapes) {
                fail(`白 ${reply} 應，白棋已經逃出去了。`);
              } else {
                ps.status = 'playing';
                const caught = d.result.captured.length ? `，提掉黑 ${d.result.captured.length} 子` : '';
                setFeedback('problem-feedback', '', `白 ${reply} 應${caught}。白棋仍在危險中，繼續追！`);
              }
              drawProblem();
            }, 380);
          }
        }
      }
      drawProblem();
    }
    bindBoard($('problem-board'), () => ps.board, onProblemClick);
    $('btn-hint').addEventListener('click', () => {
      const p = currentProblem();
      if (ps.status === 'solved' || ps.hintLevel >= p.hints.length) return;
      ps.hintLevel++;
      if (ps.status === 'failed') {
        ps.board = G.parseDiagram(p.diagram);
        ps.ko = null;
        ps.last = null;
        ps.status = 'playing';
      }
      setFeedback('problem-feedback', 'hint', `💡 ${p.hints.slice(0, ps.hintLevel).join('<br>💡 ')}`);
      drawProblem();
    });
    $('btn-reset').addEventListener('click', () => {
      const level = ps.hintLevel;
      openProblem(ps.index);
      ps.hintLevel = level;
      drawProblem();
    });
    $('btn-next').addEventListener('click', () => {
      const lesson = LESSONS[ps.lesson];
      if (ps.index + 1 < lesson.problems.length) openProblem(ps.index + 1);
      else if (ps.lesson + 1 < LESSONS.length) openLesson(ps.lesson + 1, 0);
    });

    // ---------- Practice view ----------
    const KOMI = 6.5;
    let game;
    function newGame() {
      game = {
        board: G.createBoard(SIZE), ko: null, last: null, turn: BLACK, moveNum: 0,
        capB: 0, capW: 0, passes: 0, over: false, history: [], hintLevel: 0, showOwner: false,
      };
      $('practice-log').innerHTML = '';
      setFeedback('practice-feedback', '', '黑先。開局先想想：哪裡是最有價值的地方？');
      drawPractice();
    }
    function snapshot() {
      const { board, ko, last, turn, moveNum, capB, capW, passes } = game;
      game.history.push({ board, ko, last, turn, moveNum, capB, capW, passes });
    }
    function logLine(kind, html) {
      const li = document.createElement('li');
      if (kind) li.className = kind;
      li.innerHTML = html;
      $('practice-log').prepend(li);
    }
    function drawPractice() {
      if (!game) return;
      let owner = null;
      if (game.over) owner = G.territory(game.board);
      else if (game.showOwner) owner = G.influence(game.board);
      let area = null, answer = null;
      if (game.hint && !game.over) {
        area = areaAround(game.hint.x, game.hint.y);
        if (game.hintLevel >= 2) answer = [game.hint.x, game.hint.y];
      }
      renderBoard($('practice-board'), {
        board: game.board, last: game.last, owner, area, answer,
        ghost: !game.over && game.turn === BLACK ? BLACK : null,
      });
      $('pr-move').textContent = game.moveNum;
      $('pr-caps').textContent = `${game.capB} / ${game.capW}`;
      $('pr-hint').disabled = game.over || game.turn !== BLACK;
      $('pr-undo').disabled = !game.history.length;
      $('pr-pass').disabled = game.over || game.turn !== BLACK;
      $('pr-territory').textContent = game.showOwner ? '關閉形勢' : '形勢判斷';
    }
    function describeMove(m) {
      return m && m.main ? m.main.text : '平穩的一手';
    }
    function reviewMove(analysis, x, y) {
      if (!$('pr-review').checked || !analysis.length) return;
      const best = analysis[0];
      const played = analysis.find((m) => m.x === x && m.y === y);
      if (!played) return;
      const here = coord(x, y);
      const bad = played.reasons.find((q) => ['selfatari', 'futile', 'eye', 'weak'].includes(q.tag));
      if (bad) {
        logLine('warn', `⚠ ${here}：${PRINCIPLES[bad.tag]}`);
        return;
      }
      const urgent = best.main && ['capture', 'save', 'kill', 'net'].includes(best.main.tag);
      if (best.x === x && best.y === y && best.score >= 20) {
        logLine('good', `👍 ${here} 好棋！${describeMove(played)}。`);
      } else if (urgent && best.score - played.score >= 35) {
        logLine('warn', `💭 ${here} 不錯，但錯過了 ${coord(best.x, best.y)}：${describeMove(best)}。${PRINCIPLES[best.main.tag]}`);
      } else if (best.score - played.score >= 30 && best.main) {
        logLine('', `💭 也可以考慮 ${coord(best.x, best.y)}（${describeMove(best)}）。`);
      }
    }
    function applyMove(x, y, color) {
      const r = G.play(game.board, x, y, color, game.ko);
      if (!r.legal) return r;
      snapshot();
      game.board = r.board;
      game.ko = r.ko;
      game.last = [x, y];
      game.moveNum++;
      game.passes = 0;
      if (color === BLACK) game.capB += r.captured.length;
      else game.capW += r.captured.length;
      game.turn = G.other(color);
      return r;
    }
    function onPracticeClick(x, y) {
      if (game.over || game.turn !== BLACK) return;
      const analysis = analyzeMoves(game.board, BLACK, game.ko, game.moveNum);
      const r = applyMove(x, y, BLACK);
      if (!r.legal) {
        setFeedback('practice-feedback', 'bad', r.reason);
        return;
      }
      game.hint = null;
      game.hintLevel = 0;
      if (r.captured.length) setFeedback('practice-feedback', 'good', `提掉白 ${r.captured.length} 子！`);
      else setFeedback('practice-feedback', '', '白棋思考中…');
      reviewMove(analysis, x, y);
      drawPractice();
      setTimeout(aiMove, 420);
    }
    function aiMove() {
      if (game.over || game.turn !== WHITE) return;
      const analysis = analyzeMoves(game.board, WHITE, game.ko, game.moveNum);
      const easy = $('pr-level').value === 'easy';
      const pool = analysis.filter((m) => m.score > -10 && m.score >= analysis[0].score - (easy ? 40 : 6));
      if (!pool.length || analysis[0].score < -10) {
        pass(WHITE);
        return;
      }
      const pick = pool[Math.floor(Math.random() * Math.min(pool.length, easy ? 6 : 2))];
      const r = applyMove(pick.x, pick.y, WHITE);
      const why = pick.main ? pick.main.text.replace(/^\S+\s/, '') : '穩健的一手';
      logLine('ai', `白 ${coord(pick.x, pick.y)}：${why}${r.captured.length ? `（提黑 ${r.captured.length} 子）` : ''}`);
      warnThreats();
      drawPractice();
    }
    function warnThreats() {
      const threatened = [];
      const seen = new Set();
      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          if (game.board[y][x] !== BLACK || seen.has(x + ',' + y)) continue;
          const g = G.getGroup(game.board, x, y);
          g.stones.forEach(([sx, sy]) => seen.add(sx + ',' + sy));
          if (g.libs.length === 1) threatened.push(g);
        }
      }
      if (threatened.length) {
        const g = threatened.sort((a, b) => b.stones.length - a.stones.length)[0];
        const [sx, sy] = g.stones[0];
        setFeedback('practice-feedback', 'bad', `注意！黑 ${coord(sx, sy)} 等 ${g.stones.length} 子被叫吃了。先判斷：逃得掉嗎？`);
      } else {
        setFeedback('practice-feedback', '', '輪到黑棋。');
      }
    }
    function pass(color) {
      snapshot();
      game.passes++;
      game.ko = null;
      game.last = null;
      game.turn = G.other(color);
      logLine(color === WHITE ? 'ai' : '', `${color === BLACK ? '黑' : '白'}虛著`);
      if (game.passes >= 2) endGame();
      else if (color === BLACK) setTimeout(aiMove, 300);
      else setFeedback('practice-feedback', '', '白棋虛著。如果你也覺得沒有地方可下了，就虛著結束對局。');
      drawPractice();
    }
    function endGame() {
      game.over = true;
      const t = G.countOwner(game.board, G.territory(game.board));
      const black = t.b + game.capB;
      const white = t.w + game.capW + KOMI;
      const diff = black - white;
      setFeedback('practice-feedback', diff > 0 ? 'good' : 'bad',
        `終局：黑 ${black} 目，白 ${white} 目（含貼目 ${KOMI}）。<strong>${diff > 0 ? '黑' : '白'}勝 ${Math.abs(diff)} 目</strong><br><span class="muted">簡易計目：只計算完全被一方包圍的空點，死子請在終局前提掉。</span>`);
      drawPractice();
    }
    bindBoard($('practice-board'), () => game.board, onPracticeClick);
    $('pr-hint').addEventListener('click', () => {
      if (game.over || game.turn !== BLACK) return;
      if (!game.hint) {
        const analysis = analyzeMoves(game.board, BLACK, game.ko, game.moveNum);
        game.hint = analysis[0];
      }
      game.hintLevel = Math.min(2, game.hintLevel + 1);
      const h = game.hint;
      if (!h) return;
      const principle = h.main ? PRINCIPLES[h.main.tag] : '';
      if (game.hintLevel === 1) {
        setFeedback('practice-feedback', 'hint', `💡 方向：看看黃色區域。${principle}<br><span class="muted">再按一次會顯示確切落點。</span>`);
      } else {
        setFeedback('practice-feedback', 'hint', `💡 建議 <strong>${coord(h.x, h.y)}</strong>：${describeMove(h)}。<br>${principle}`);
      }
      drawPractice();
    });
    $('pr-undo').addEventListener('click', () => {
      if (!game.history.length) return;
      let s = game.history.pop();
      while (s.turn !== BLACK && game.history.length) s = game.history.pop();
      Object.assign(game, s, { over: false, hint: null, hintLevel: 0 });
      logLine('', '↶ 悔棋');
      setFeedback('practice-feedback', '', '已悔棋，輪到黑棋。');
      drawPractice();
    });
    $('pr-pass').addEventListener('click', () => {
      if (!game.over && game.turn === BLACK) pass(BLACK);
    });
    $('pr-territory').addEventListener('click', () => {
      game.showOwner = !game.showOwner;
      if (game.showOwner && !game.over) {
        const t = G.countOwner(game.board, G.influence(game.board));
        setFeedback('practice-feedback', '', `形勢估計：黑約 ${t.b + game.capB} 目，白約 ${t.w + game.capW} 目＋貼目 ${KOMI}。<br><span class="muted">方塊表示目前勢力範圍，只是粗估。</span>`);
      }
      drawPractice();
    });
    $('pr-new').addEventListener('click', newGame);

    // ---------- Proverbs view ----------
    const card = ([t, d]) => `<div class="card"><h3>${t}</h3><p>${d}</p></div>`;
    $('ten-rules').innerHTML = TEN_RULES.map(card).join('');
    $('sayings').innerHTML = SAYINGS.map(card).join('');

    newGame();
    openLesson(0, 0);
  })();
  </script>
</body>
</html>
